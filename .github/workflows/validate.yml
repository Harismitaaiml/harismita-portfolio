name: Validate HTML
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  html-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML with Nu HTML Checker
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: false
