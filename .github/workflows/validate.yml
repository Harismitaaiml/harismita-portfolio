name: Validate HTML & CSS

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install validation tools
        run: npm install --global htmlhint stylelint

      - name: Validate HTML
        run: htmlhint "*.html" --config .htmlhintrc

      - name: Validate CSS
        run: stylelint "css/*.css" --config .stylelintrc.json
