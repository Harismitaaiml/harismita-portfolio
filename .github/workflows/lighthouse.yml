name: Lighthouse Audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          python3 -m http.server 8080 > /tmp/portfolio-server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          lhci autorun --collect.url=http://localhost:8080 --collect.numberOfRuns=1 --upload.target=temporary-public-storage
          kill $SERVER_PID
