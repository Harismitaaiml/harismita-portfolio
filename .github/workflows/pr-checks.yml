name: Pull Request Quality Checks
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check page title
        run: grep -Eiq '<title>[^<]+' index.html
  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check images have alt text
        run: |
          python3 - <<'PYCODE'
          import re, sys
          html = open('index.html', encoding='utf-8').read()
          missing = [tag for tag in re.findall(r'<img\b[^>]*>', html, re.I) if not re.search(r'\balt\s*=', tag, re.I)]
          if missing:
              print('Images missing alt attributes:', *missing, sep='\n')
              sys.exit(1)
          print('All images have alt attributes.')
          PYCODE
  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for debug console statements
        run: |
          if grep -Rn 'console\.log' js/; then
            echo 'Remove console.log statements before merging.'
            exit 1
          fi
  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [check-html-titles, check-image-alt, check-no-console-log]
    steps:
      - name: Confirm all PR checks passed
        run: echo 'All PR checks passed. Ready for review.'
